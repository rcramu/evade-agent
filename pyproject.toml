[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evadeagent"
version = "0.1.0"
description = "Laboratory runtime-assurance engine for EVADE-AGENT"
requires-python = ">=3.11"
authors = [{ name = "Ramu Rangineni Chenchaiah" }]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
